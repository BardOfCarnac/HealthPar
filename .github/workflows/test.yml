name: HealthPar tests

on:
  push:
    branches: [main, agent/medscan-domain-foundation, agent/medscan-anatomy-prototype]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node --check web/app.js
      - run: node --check web/healthpar-client.js
      - run: node --check web/anatomy-anchors.js
      - run: node --check web/anatomy-bootstrap.js
      - run: node --check web/anatomy-viewer.js
